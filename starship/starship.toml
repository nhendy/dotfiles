"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

# Show the active Python venv + version — key for the uv/JAX/PyTorch workflow.
[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold green"

[nodejs]
symbol = " "

[rust]
symbol = " "

[golang]
symbol = " "

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "
