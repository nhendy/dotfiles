# ~/.tmux.conf — managed by ~/dotfiles (cleaned from nhendy/myvimrc;
# removed the broken `default-shell /bin/a` line and the Fig integration).

# --- Prefix: Ctrl-s (kept from old setup) ---
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# --- General behaviour ---
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10            # snappy <Esc> in neovim
set -g focus-events on
setw -g mode-keys vi

# --- True color so neovim's termguicolors works inside tmux ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g default-shell "$SHELL"

# --- Quick config reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Status line ---
set -g status-interval 1
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g automatic-rename on
set -g automatic-rename-format '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || basename "#{pane_current_path}")'

# --- Plugins (managed by TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# --- Initialize TPM (keep this line at the very bottom) ---
run -b '~/.tmux/plugins/tpm/tpm'
